user www-data;
pid /run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections  51200;
    use epoll;
}


http {

    log_format  main_json '{"@timestamp": "$time_iso8601", '
                          '"remote_addr": "$remote_addr", '
                          '"Remoteip": "$http_Remoteip", '
                          '"realip_remote_addr": "$realip_remote_addr", '
                          '"http_x_forwarded_for": "$http_x_forwarded_for", '
                          '"scheme": "$scheme", '
                          '"request_method": "$request_method", '
                          '"host": "$host", '
                          '"request_uri": "$request_uri", '
                          '"body_bytes_sent": $body_bytes_sent, '
                          '"http_referer": "$http_referer", '
                          '"http_user_agent": "$http_user_agent", '
                          '"upstream_addr": "$upstream_addr", '
                          '"request_time": $request_time, '
                          '"request_length": $request_length, '
                          '"cookie_staff_id": "$cookie_staff_id", '
                          '"cookie_login_name": "$cookie_login_name", '
                          '"upstream_connect_time": "$upstream_connect_time", '
                          '"upstream_header_time": "$upstream_header_time", '
                          '"upstream_response_time": "$upstream_response_time", '
                          '"upstream_status": "$upstream_status", '
                          '"status": "$status"}';
                                                 
    access_log /dev/stdout  main_json;

    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    max_ranges 1;
    tcp_nodelay on;
    keepalive_timeout  180;
    send_timeout 180;
    proxy_ignore_client_abort on;
    reset_timedout_connection on;
    open_file_cache max=65535 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 5;
    open_file_cache_errors off;
    client_header_timeout 180;
    client_body_timeout 180;
    client_max_body_size 100m;
    client_body_buffer_size 100M;
    client_header_buffer_size 320k;
    large_client_header_buffers 4 320k;
    fastcgi_connect_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 8 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
    gzip  on;
    gzip_min_length 1k;
    gzip_buffers 4 16K;
    gzip_comp_level 3;
    gzip_types  application/x-javascript text/css application/javascript text/javascript text/plain text/xml application/json application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf application/xml font/eot font/opentype font/otf image/svg+xml image/vnd.microsoft.icon;
    gzip_disable "MSIE [1-6]\.";  

    server {
        charset utf-8;
        listen 	80;
        server_name  default;
    	
        root	/app/${APP}/web;
    
        index index.html index.php index.htm;
        set $yii_bootstrap "index.php";
    	
        location ~ \.(jpg|png|jpeg|bmp|gif|swf|css|js|pdf|ico|woff|tff)$
        {
            access_log off;
            expires 30d;
        }		
    
        location / {
            try_files $uri $uri/ /$yii_bootstrap?$args;
        }
    
        location ~ ^/(protected|framework|themes/\w+/views) {
            deny  all;
        }
    
        location ~ \.(js|css|png|jpg|gif|swf|ico|pdf|mov|fla|zip|rar)$ {
            try_files $uri =404;
        }
    
        location ~ \.php {
    	proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            fastcgi_split_path_info  ^(.+\.php)(.*)$;
            set $fsn /$yii_bootstrap;
            if (-f $document_root$fastcgi_script_name){
                set $fsn $fastcgi_script_name;
            }
            fastcgi_pass   127.0.0.1:9000;
            #fastcgi_pass   unix:/var/run/php-fpm/php-fpm.socket;
            include fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fsn;
            fastcgi_param  PATH_INFO        $fastcgi_path_info;
            fastcgi_param  PATH_TRANSLATED  $document_root$fsn;
            fastcgi_param  PHP_VALUE        open_basedir=/tmp:/app;
            fastcgi_param  REDIRECT_STATUS  200;
            fastcgi_param  ICKEY_ENV        ${APP_ENV};
        }
    
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    	
        location /_/nginx_status {
            stub_status on;
        }
    
        location ~ ^/_/php_fpm_(status|ping)$ {
            allow 127.0.0.1;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;
            #fastcgi_pass   unix:/var/run/php-fpm/php-fpm.socket;
        }
    
    }

}

