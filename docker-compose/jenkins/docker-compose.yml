services:
  jenkins:
    build: .
    container_name: jenkins
    user: root
    ports:
      - 8086:8080
      - 50000:50000
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime
    environment:
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - 'JAVA_OPTS=-Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8 -Djava.awt.headless=true'
    extra_hosts:
      - 'git.leops.local=192.168.77.140'
      - 'harbor.leops.local=192.168.77.140'
      - 'nexus.leops.local=192.168.77.140'
      - 'verdaccio.leops.local=192.168.77.140'
      - 'goproxy.leops.local=192.168.77.140'
    restart: always
