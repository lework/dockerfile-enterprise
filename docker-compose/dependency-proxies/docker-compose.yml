services:
  # --- Go 依赖代理 ---
  goproxy:
    container_name: goproxy
    image: goproxy/goproxy:latest
    restart: always
    # 容器内监听 8080, 代理 goproxy.cn, 不代理私有仓库 git.leops.local
    command: "-listen=0.0.0.0:80 -cacheDir=/go/cache -proxy https://goproxy.io -exclude 'git.leops.local'"
    ports:
      - "8082:80"
    volumes:
      - ./goproxy/cache:/go/cache # 持久化缓存
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai

  # --- Node.js (npm) 依赖代理 ---
  verdaccio:
    container_name: verdaccio
    image: verdaccio/verdaccio:6.1
    restart: always
    ports:
      - "8083:4873"
    volumes:
      - ./verdaccio/storage:/verdaccio/storage # 持久化存储
      - ./verdaccio/conf:/verdaccio/conf # 挂载配置目录
      - ./verdaccio/plugins:/verdaccio/plugins # 挂载插件目录
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    user: root
    environment:
      - TZ=Asia/Shanghai
      - VERDACCIO_PORT=4873
      - VERDACCIO_PUBLIC_URL=//verdaccio.leops.local

  # --- Python (pip) & Java (Maven/Gradle) 依赖代理 ---
  nexus:
    container_name: nexus
    image: sonatype/nexus3:3.79.1-alpine
    restart: always
    user: root
    ports:
      - "8084:8081"
    volumes:
      - ./nexus/data:/nexus-data
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai